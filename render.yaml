services:
  - type: web
    name: izlek-destek-masasi
    runtime: ruby
    plan: free
    region: frankfurt
    buildCommand: bash bin/render-build.sh
    startCommand: bash bin/render-start.sh
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

